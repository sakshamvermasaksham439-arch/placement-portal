services:
  mongo:
    image: mongo:7
    volumes: [mongo_data:/data/db]
  backend:
    build: ./backend
    ports: ["5000:5000"]
    environment:
      PORT: 5000
      NODE_ENV: development
      MONGO_URI: mongodb://mongo:27017/placement_portal
      JWT_SECRET: docker_dev_secret_change_me
      CLIENT_URL: http://127.0.0.1:5500
    depends_on: [mongo]
    volumes: [uploads_data:/app/uploads]
volumes:
  mongo_data:
  uploads_data:
