<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register</title><link rel="stylesheet" href="css/style.css"></head>
<body><main><div class="card" style="max-width:420px;margin:3rem auto"><h2>Register</h2>
<input id="name" placeholder="Full name"><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password (min 8)">
<select id="role"><option value="student">Student</option><option value="recruiter">Recruiter</option><option value="alumni">Alumni</option></select>
<input id="company" placeholder="Company (recruiter / alumni)">
<p id="msg" class="error"></p><button class="btn" id="go">Register</button> <a href="login.html">Login</a></div></main>
<script type="module">
import { api } from './js/api.js';

const nameInput = document.getElementById('name');
const emailInput = document.getElementById('email');
const passwordInput = document.getElementById('password');
const roleInput = document.getElementById('role');
const companyInput = document.getElementById('company');
const msg = document.getElementById('msg');
const registerBtn = document.getElementById('go');

registerBtn.addEventListener('click', async () => {
  try {
    const nameValue = nameInput.value.trim();
    const emailValue = emailInput.value.trim();
    const passwordValue = passwordInput.value;
    const roleValue = roleInput.value;
    const companyValue = companyInput.value.trim();

    if (nameValue.length < 2) {
      msg.textContent = 'Name must be at least 2 characters';
      return;
    }

    const { data } = await api('/auth/register', {
      method: 'POST',
      body: {
        name: nameValue,
        email: emailValue,
        password: passwordValue,
        role: roleValue,
        company: companyValue
      }
    });

    localStorage.setItem('token', data.token);
    localStorage.setItem('user', JSON.stringify(data.user));
    window.location.href = 'dashboard.html';

  } catch (e) {
    msg.textContent = e.message;
  }
});
</script>
